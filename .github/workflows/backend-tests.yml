name: Backend tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Run backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check test safety without Docker or a database
        run: |
          python3 -B -m unittest discover -s backend/safety_tests -v
          bash -n scripts/backend-test.sh

      - name: Run backend tests against isolated database
        run: bash scripts/backend-test.sh

      # The runner owns its unique project's EXIT cleanup, without -v.
      # Never use the development Compose project for CI setup or cleanup.
